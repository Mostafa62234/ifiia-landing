<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — الصفحة غير موجودة | I.F.I.A</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="/fonts.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0B1B33; color:#F7FAFC; font-family:'Cairo',system-ui,sans-serif;
    background-image:linear-gradient(rgba(197,168,128,.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(197,168,128,.07) 1px,transparent 1px);
    background-size:72px 72px; padding:24px; text-align:center;
  }
  .box { max-width:560px; }
  .code { font-family:'Amiri',Georgia,serif; font-size:clamp(5rem,18vw,10rem); font-weight:700;
          color:#C5A880; line-height:1; -webkit-text-stroke:1px rgba(197,168,128,.35); }
  h1 { font-family:'Amiri',Georgia,serif; font-size:clamp(1.5rem,4vw,2.2rem); margin-top:12px; }
  p  { color:rgba(247,250,252,.7); margin-top:14px; line-height:1.8; font-size:.95rem; }
  .btns { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:30px; }
  a { text-decoration:none; font-weight:800; font-size:.8rem; letter-spacing:.12em;
      text-transform:uppercase; padding:14px 30px; display:inline-block; }
  .gold  { background:#C5A880; color:#0B1B33; transition:background .2s,color .2s; }
  .gold:hover  { background:#0B1B33; color:#C5A880; box-shadow:inset 0 0 0 1px #C5A880; }
  .ghost { color:#E0CDA9; box-shadow:inset 0 0 0 1px rgba(197,168,128,.55); transition:all .2s; }
  .ghost:hover { background:#C5A880; color:#0B1B33; }
  .lang { display:flex; gap:8px; justify-content:center; margin-top:26px; }
  .lang button { background:transparent; border:1px solid rgba(197,168,128,.6); color:#C5A880;
                 font-family:'Cairo',sans-serif; font-weight:700; font-size:.75rem;
                 padding:6px 14px; cursor:pointer; }
  .lang button.on { background:#C5A880; color:#0B1B33; }
  html.en body { font-family:'Inter',system-ui,sans-serif; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1 data-ar="الصفحة غير موجودة" data-en="Page not found">الصفحة غير موجودة</h1>
    <p data-ar="عذراً، الرابط الذي طلبته غير متوفر أو تم نقله. يمكنك العودة إلى الصفحة الرئيسية أو الاطلاع على خدماتنا ودوراتنا التدريبية."
       data-en="Sorry, the link you requested is unavailable or has moved. You can return to the homepage or explore our services and training courses.">
      عذراً، الرابط الذي طلبته غير متوفر أو تم نقله. يمكنك العودة إلى الصفحة الرئيسية أو الاطلاع على خدماتنا ودوراتنا التدريبية.
    </p>
    <div class="btns">
      <a class="gold" href="/" data-ar="الصفحة الرئيسية" data-en="Homepage">الصفحة الرئيسية</a>
      <a class="ghost" href="/#courses" data-ar="الدورات والدبلومات" data-en="Courses & Diplomas">الدورات والدبلومات</a>
      <a class="ghost" href="/#consult" data-ar="استشارة مجانية" data-en="Free Consultation">استشارة مجانية</a>
    </div>
    <div class="lang">
      <button id="ar" class="on">العربية</button>
      <button id="en">English</button>
    </div>
  </div>
<script>
  function setLang(l) {
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-ar][data-en]').forEach(function (el) {
      el.textContent = el.getAttribute('data-' + l);
    });
    document.getElementById('ar').classList.toggle('on', l === 'ar');
    document.getElementById('en').classList.toggle('on', l === 'en');
    try { localStorage.setItem('ifiia-lang', l); } catch (e) {}
  }
  document.getElementById('ar').onclick = function () { setLang('ar'); };
  document.getElementById('en').onclick = function () { setLang('en'); };
  try { if (localStorage.getItem('ifiia-lang') === 'en') setLang('en'); } catch (e) {}
</script>
</body>
</html>
